<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito - Minas Materiais</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; border-top: 5px solid #F2B705;}
        h2 { color: #1e2b4d; margin-top: 0; margin-bottom: 5px;}
        input[type="password"] { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; text-align: center; letter-spacing: 2px;}
        button { background: #1e2b4d; color: white; font-weight: bold; font-size: 16px; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #111a30; }
        .erro { color: white; background: #dc3545; padding: 10px; border-radius: 5px; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acesso Restrito</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Gerenciador de Orçamentos</p>
        
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <input type="password" name="senha" placeholder="Digite a senha padrão" required autofocus>
            <button type="submit">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
